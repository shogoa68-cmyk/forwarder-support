name: Deploy to GitHub Pages

# main へ push されると自動デプロイ。手動実行も可（workflow_dispatch）。
# 公開対象は `フォワーダー支援/` フォルダの中身（見積支援/ は保険なので公開しない）。
# URL: https://shogoa68-cmyk.github.io/forwarder-support/

on:
  push:
    branches: [main]
    paths:
      - 'フォワーダー支援/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行は 1 つに絞る（連続 push で並行デプロイにならないように）
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url || steps.deployment3.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # キャッシュ無効化：公開フォルダ直下の HTML が読み込むローカル CSS/JS に
      # コミットSHAの ?v= を付与。デプロイのたびにアセットURLが変わり、
      # ブラウザ/CDN の旧キャッシュで古い見た目が残るのを防ぐ（CDNの https:// 参照は対象外）。
      - name: Cache-bust local CSS/JS (?v=<sha>)
        run: |
          V="${GITHUB_SHA::8}"
          for f in $(find フォワーダー支援 -maxdepth 1 -name '*.html'); do
            sed -i -E "s#href=\"(css/[^\"?]+)\"#href=\"\1?v=${V}\"#g; s#src=\"((js|shared|data)/[^\"?]+)\"#src=\"\1?v=${V}\"#g" "$f"
          done
          echo "Stamped local assets with ?v=${V}"

      - name: Upload artifact (フォワーダー支援/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './フォワーダー支援'

      # 注意：Pages 側が混雑して deployment_queued のまま10分で
      # Timeout reached, aborting! になることがあるが、ワークフロー側では回避できない。
      #  - timeout 入力は MAX_TIMEOUT=600000（10分）でクランプされるので延長不可
      #    （this.timeout = Math.min(timeoutInput, MAX_TIMEOUT)）
      #  - 同一 run 内での再試行も不可。deployment ID がコミットSHAと同じで、
      #    1回目のタイムアウトでキャンセル済みのため即 "Deployment cancelled." になる
      #  - タイムアウトした側が Pages 側で「実行中」のまま残ると、以降のデプロイが
      #    400 "due to in progress deployment. Please cancel <sha> first" で作成拒否される。
      #    その場合は Settings → Environments → github-pages で当該デプロイを Cancel する
      # 復旧後に Actions から Re-run するか、新しいコミットを push し直すこと。
      #
      # 自動のやり直し（2026-11）：アップロード直後に deploy-pages が
      #   "Fetching artifact metadata failed ... No artifacts named "github-pages" were found"
      # で落ちることが続いた（GitHub 側で、預けた直後の成果物がまだ一覧に出ていない）。
      # このときは Pages のデプロイ自体が作られる前に止まっているので、少し待って同じ run の中で
      # もう一度呼べば通る。1 回目の前に 15 秒、失敗したら 45 秒・90 秒あけて最大 3 回まで試す。
      # （上の「タイムアウト」の場合はやり直しても通らないので、3 回目も失敗して従来どおり赤になる）
      - name: Wait for the artifact to be visible
        run: sleep 15

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry (1)
        if: steps.deployment.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (retry 1)
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry (2)
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 90

      - name: Deploy to GitHub Pages (retry 2)
        id: deployment3
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v4
