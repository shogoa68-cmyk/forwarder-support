name: Deploy to GitHub Pages

# main へ push されると自動デプロイ。手動実行も可（workflow_dispatch）。
# 公開対象は `フォワーダー支援/` フォルダの中身（見積支援/ は保険なので公開しない）。
# URL: https://shogoa68-cmyk.github.io/forwarder-support/

on:
  push:
    branches: [main]
    paths:
      - 'フォワーダー支援/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行は 1 つに絞る（連続 push で並行デプロイにならないように）
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # キャッシュ無効化：公開フォルダ直下の HTML が読み込むローカル CSS/JS に
      # コミットSHAの ?v= を付与。デプロイのたびにアセットURLが変わり、
      # ブラウザ/CDN の旧キャッシュで古い見た目が残るのを防ぐ（CDNの https:// 参照は対象外）。
      - name: Cache-bust local CSS/JS (?v=<sha>)
        run: |
          V="${GITHUB_SHA::8}"
          for f in $(find フォワーダー支援 -maxdepth 1 -name '*.html'); do
            sed -i -E "s#href=\"(css/[^\"?]+)\"#href=\"\1?v=${V}\"#g; s#src=\"((js|shared|data)/[^\"?]+)\"#src=\"\1?v=${V}\"#g" "$f"
          done
          echo "Stamped local assets with ?v=${V}"

      - name: Upload artifact (フォワーダー支援/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './フォワーダー支援'

      # GitHub Pages 側が混雑すると deployment_queued のまま滞留し、
      # 10分で Timeout reached, aborting! となって公開が古いまま残ることがある。
      # deploy-pages の timeout 入力は MAX_TIMEOUT=600000（10分）でクランプされるため延長できない
      # （this.timeout = Math.min(timeoutInput, MAX_TIMEOUT)）。代わりに一度だけ再試行する。
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Deploy to GitHub Pages (再試行)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
